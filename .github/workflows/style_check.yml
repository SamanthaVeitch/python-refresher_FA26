name: style_check

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  style:
    name: Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pycodestyle
        run: python -m pip install pycodestyle

      - name: Run pycodestyle
        run: pycodestyle .